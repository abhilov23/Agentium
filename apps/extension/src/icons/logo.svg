<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="arc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="node-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Window Body -->
  <rect x="4" y="6" width="56" height="52" rx="12" fill="#121622" stroke="#2A344A" stroke-width="1.5" />

  <!-- Title bar divider -->
  <path d="M4 18H60" stroke="#1E2638" stroke-width="1.2" />

  <!-- Mac Control Dots -->
  <circle cx="11" cy="12" r="2.2" fill="#EF4444" />
  <circle cx="16.5" cy="12" r="2.2" fill="#F59E0B" />
  <circle cx="22" cy="12" r="2.2" fill="#10B981" />

  <!-- Bridge Arc -->
  <path d="M16 43 C16 26, 48 26, 48 43" stroke="#06B6D4" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 2.5" filter="url(#arc-glow)" opacity="0.9" />
  <path d="M16 43 C16 26, 48 26, 48 43" stroke="#14B8A6" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 2.5" />

  <!-- Green Node (Agentium Agent) -->
  <circle cx="16" cy="43" r="5" fill="#10B981" filter="url(#node-glow)" opacity="0.5" />
  <circle cx="16" cy="43" r="4.5" fill="#10B981" />
  <circle cx="16" cy="43" r="2" fill="#FFFFFF" />

  <!-- Blue Node (Chrome Browser Tab) -->
  <circle cx="48" cy="43" r="5" fill="#0284C7" filter="url(#node-glow)" opacity="0.5" />
  <circle cx="48" cy="43" r="4.5" fill="#0284C7" />
  <circle cx="48" cy="43" r="2" fill="#FFFFFF" />

  <!-- PERFECT STRAIGHT-STEM CURSOR ARROW -->
  <g transform="translate(32, 27) rotate(-22)">
    <path
      d="M0 0 L0 18 L5 14 L9 22 L13 20 L9 12 L15 12 Z"
      fill="#FFFFFF"
      stroke="#0E121C"
      stroke-width="1.2"
      stroke-linejoin="round"
    />
  </g>
</svg>
